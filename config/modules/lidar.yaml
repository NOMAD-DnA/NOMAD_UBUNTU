ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: g2_laser
    ignore_array: ""
    baudrate: 230400
    lidar_type: 1
    device_type: 0
    isSingleChannel: false
    intensity: true
    intensity_bit: 8
    auto_intensity: false
    sample_rate: 5
    abnormal_check_count: 4
    fixed_resolution: false
    reversion: false
    inverted: false
    auto_reconnect: false
    support_motor_dtr: true
    angle_max: 180.0
    angle_min: -180.0
    range_max: 16.0
    range_min: 0.28
    frequency: 5.0
    invalid_range_is_inf: true
    debug: false
