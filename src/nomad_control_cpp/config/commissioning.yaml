nomad_vesc_trial:
  ros__parameters:
    use_sim_time: false
    mode: commission
    # 실제 측정 보정과 구분합니다. 두 준비 플래그는 현재 시험의 확인 후에만 적용합니다.
    calibration_verified: false
    hardware_timeout_verified: false
    commissioning_setup_acknowledged: false
    # 시작 스크립트의 VESC 설정 재조회 성공 후에만 verified를 실행 인자로 지정합니다.
    speed_pid_min_erpm: 50.0
    speed_pid_min_erpm_verified: false
    steering_input_limit_rad: 0.55
    # 공중 시험의 사용자 관찰 메모이며 목표값을 이 수치로 올리거나 제한하지 않습니다.
    observed_smooth_start_erpm: 550.0
    telemetry_topic: /nomad_bench/sensors/core
    motor_speed_topic: /nomad_bench/commands/motor/speed
    motor_current_topic: /nomad_bench/commands/motor/current
    servo_topic: /nomad_bench/commands/servo/position
    motor_duty_topic: /nomad_bench/commands/motor/duty_cycle
    motor_brake_topic: /nomad_bench/commands/motor/brake
    motor_position_topic: /nomad_bench/commands/motor/position
    # 2026-11-12: stop/pause/fault release = VESC brake current (was 0A coast; rolled back on slopes
    # with HFI). Value used in the 11-12 evening slope runs (brake only slows; it does not hold).
    # 0 restores coast. Range 0..30 A. 2026-11-13: a latched VESC fault code releases with 0A instead;
    # the choice and hold latch live in include/nomad_control_cpp/stop_output.hpp.
    stop_brake_current_a: 20.0
    # 2026-11-12: brake current did not hold on the slope (speed-dependent). At or below this |ERPM| the
    # release holds the rotor with the VESC handbrake. Candidate value; 0 disables. 2026-11-13: entered only on
    # healthy telemetry with a handbrake subscriber, then latched until the next drive command; given up (brake)
    # when a reading 0.1 s later exceeds max(2x, +200) ERPM (400 here) or the subscriber disappears.
    # Needs the patched vesc_driver (commands/motor/handbrake) and driver handbrake_max >= this value.
    # 11-12 21:42 (VIO pose): 12 of 13 stops moved under ~4 cm (most under 1 cm), but the stop right after a
    # 33.8 A climb rolled ~10-15 cm back while VESC ERPM read 0 (the handbrake freezes the ERPM
    # estimate). 11-13 VESC Tool handbrake on artificial slopes: 30 A stopped at once on 14 and 20 deg (the
    # costmap climb limit); lower currents slid a little on 14 deg first. 14 deg climb drew ~27 A.
    motor_handbrake_topic: /nomad_bench/commands/motor/handbrake
    stop_handbrake_current_a: 30.0
    stop_handbrake_below_erpm: 200.0
    # 2026-11-13: load-sized hold (stop_output.hpp; only the VESC telemetry this node already reads). Hold =
    # clamp(gain * |s*iq - rolling| + margin, min, stop_handbrake_current_a) from the VESC avg_iq at the end of
    # the last drive (s = commanded direction; the speed PID brakes downhill, so the same formula covers both),
    # used only when the drive ended settled (|ERPM| within 25% of the command for 0.3 s). Otherwise the previous
    # hold current (raised to what this drive's own largest load needs) if the car moved <= ~24 cm in total since
    # the last hold that set its current, else stop_handbrake_current_a. Flat 12.5 A, 16 A climb
    # (~7 deg) 22.5 A, 14 deg climb (27 A) or steeper 30 A; 30 A all the time would put ~15 W into the motor on
    # every flat stop. Candidate values (below 14 deg not measured); rolling 6 A sits between the 11-12 cruise
    # median (~8 A) and lower quartile (~4 A). min 0 = fixed stop_handbrake_current_a.
    stop_handbrake_min_current_a: 12.5
    stop_handbrake_load_gain: 1.45
    stop_handbrake_rolling_current_a: 6.0
    stop_handbrake_margin_a: 8.0
    # 2026-11-13: after each restart (stop output -> speed command) log '[RESTART_TRACE]' every control tick
    # (cmd/measured ERPM, current_a, VESC avg_iq) for this many seconds, to judge VESC speed-PID tuning
    # (s_pid_kp/ki) on slopes; 3 s also covers slow restarts with the current gains. 0 = off.
    restart_trace_s: 3.0
    # 후보 시험 한계이며 측정된 속도/각도 또는 기계적 안전 범위가 아닙니다.
    commissioning.motor_max_erpm: 1850.0
    commissioning.overspeed_erpm: 2500.0
    # 2026-11-07 사용자 지상 조종 보고: 서보 0~1 전 범위 정상 동작.
    # 직접 서보 입력을 사용하며 steering_input_limit_rad는 이전 GUI 호환 메타데이터입니다.
    commissioning.servo_center: 0.50
    commissioning.servo_min: 0.0
    commissioning.servo_max: 1.0
    commissioning.max_duration_s: 3.0
    commissioning.telemetry_timeout_s: 0.30
    # 공중 Wi-Fi 연속 MANUAL만 최대 2초 발행 시각 감시. telemetry 0.30초·제어 루프 0.20초는 유지합니다.
    commissioning.manual_timeout_s: 2.0
    commissioning.max_tick_gap_s: 0.20
    commissioning.stationary_hold_s: 0.50
    commissioning.stationary_erpm: 50.0
    # Battery input current limit. VESC battery limit is set higher; this keeps the 30 A guard.
    commissioning.current_limit_a: 30.0
    # Motor (phase) current limit. Low-speed starts on rough ground draw 30-35 A of motor current
    # while the battery supplies only 2-3 A (11-11 integration logs); VESC motor limit was +-60 A (11-13: being lowered to +-50 A).
    commissioning.motor_current_limit_a: 55.0
    # Above a limit: a short spike releases output and headless planning resumes on its own.
    # It latches (RESET needed) when it lasts 0.3 s, goes above 60 A once, or repeats 3 times in 10 s.
    commissioning.overcurrent_hard_a: 60.0
    commissioning.overcurrent_sustain_s: 0.30
    commissioning.overcurrent_spike_limit: 3
    commissioning.overcurrent_spike_window_s: 10.0
    commissioning.motor_ramp_erpm_s: 1200.0
    commissioning.motor_deceleration_erpm_s: 2400.0
    commissioning.stall_watchdog_enabled: true
    commissioning.stall_timeout_s: 2.0
    commissioning.stall_command_erpm: 50.0
    commissioning.stall_feedback_erpm: 50.0
    commissioning.servo_rate_s: 0.04
    # 연속 수동 조작의 서보 명령 변화율이며 실제 바퀴 각속도가 아닙니다.
    commissioning.manual_servo_rate_s: 0.40
