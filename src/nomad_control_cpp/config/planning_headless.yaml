# commissioning.yaml, planning.yaml 뒤에 적용하는 자율주행 전용 프로필.
nomad_vesc_trial:
  ros__parameters:
    planning.headless: true
    planning.resume_after_stop: true
    planning.measured_speed_control: true
    # 양수 LPP 요청: max(이 값, 요청 ERPM). 속도 0은 바로 출력 해제(감속 중이면 감속을 마침), STOP·명령 끊김은 아래 감속 뒤 해제.
    # 일반 주행 최종 송신에도 적용하며, 측정 과속 감속 시에는 예외입니다.
    planning.minimum_running_erpm: 1000.0
    planning.feedback_limit_erpm: 1200.0
    # 2026-11-13: LPP STOP / lost LPP input (expiry, planner publisher count not 1) ramp the speed command from
    # min(command, measured) down to stop_handbrake_below_erpm (200) over this many seconds and keep 200 until the
    # measured ERPM is there (at most 0.6 s more), so the handbrake follows without a 20 A brake pulse.
    # Stopping from ~1000 ERPM within ~50 ms made the car lurch. Faults, operator STOP, overspeed, telemetry/driver
    # loss and a car already at or below 200 ERPM still stop at once; a fresh moving LPP command during the ramp
    # cancels it. Adds ~4-6 cm of stop distance at 1000 ERPM. 0 = stop at once (before 11-13). Range 0..1 s.
    # 2026-11-18: the ramp ends when 2 of the last 3 measured readings are at or below 200 (a lone HFI drop no longer
    # ends it: 57 of 95 field ramps on 11-16 did, with the car still moving). 11-17 used 3 in a row, which kept
    # 11-18 parking-garage ramps at 200 ERPM for a median 0.63 s when readings straddled 200.
    # 2026-11-20: "measured" is the highest of the last 3 readings within 0.1 s, and a car stops at once only when all
    # of them are at or below 200 (on 11-19 a lone HFI low, 820/613/-52 at ~0.2-0.37 m/s, took a 30 A handbrake at
    # speed in 2 of 88 stops).
    planning.stop_ramp_s: 0.3
    # 2026-11-17: after a stop caused by lost/invalid LPP input (Wi-Fi), resume only after this long of continuous
    # fresh commands; a stop by a planner STOP alone still resumes on the next fresh command. On 11-16 the car stopped
    # and restarted 0.1-0.44 s later 6 times (20-36 A starts, 30 A holds). 0 = resume at once (before 11-17). Range
    # 0..2 s. 2026-11-20: a planner STOP after a link loss no longer clears this wait (the planner's own STOPs from the
    # outage arrive when the link returns; on 11-19, 6 of 8 such stops restarted within 0.1 s).
    planning.link_resume_stable_s: 0.3
    # 2026-11-17 (4a): slip/stuck display from /nomad/localization/odometry + /nomad/localization/status
    # (slip_monitor.hpp). Display and [SLIP] log lines only: the output is never changed by it. Off while the pose or
    # status is stale/not READY (Wi-Fi). false = no localization subscriptions at all.
    slip.enabled: true
    planning.allow_estimated_calibration: true
